id: leeds-compsoc-ctf-2026
name: Leeds CompSoc CTF TEST
type: hidden
password: LUCS26-CTF-SETUP

description: |
  Leeds Computing Society Capture the Flag competition.

  Work in teams of up to four and solve as many challenges as you can
  before the competition ends.

  You can attempt the challenges in any order. You do not need to
  complete the easier challenges before trying a harder one.

  Each challenge gives you a flag when you solve it. Submit the final
  pwn.college{...} flag on the challenge page to score.

  **How scoring works:**

  Your team scores one point for each unique challenge that any team
  member solves. If two people on the same team solve the same
  challenge, it still counts as one point. The best strategy is to
  split up and work on different challenges.

  **Never done a CTF before?**

  Start with the Beginner challenges. They walk you through every step
  and introduce the tools you need as you go.

  **Important things to know:**

  Each challenge runs inside pwn.college. Use the Terminal for
  command-line challenges.

  If a challenge uses localhost or 127.0.0.1, open Firefox inside the
  pwn.college Desktop. Your normal browser is outside the virtual
  computer and cannot reach it.

  If you need to move text between the virtual computer and your
  normal browser, use the Clipboard panel in the side tab of the
  pwn.college Desktop.

  If you get stuck, ask your team or a volunteer. You can also use
  SENSAI, the AI helper built into pwn.college. Start your challenge
  first, then use the Help link at the top of the page to access
  SENSAI.

modules:

  # ──────────────────────────────────────────────────────────────
  #  BEGINNER
  # ──────────────────────────────────────────────────────────────

  - id: beginner
    name: "🟢 Beginner"
    description: |
      Never done a CTF before? Start here.

      These challenges introduce basic commands and simple ideas.
      You do not need previous cybersecurity or programming experience.

      The Terminal is where you type instructions for the computer. You
      will use it to find files, search for information and run the tools
      you need to solve challenges.

      You can complete the challenges in any order.

      If you get stuck, try working it out with your team first. You can
      also ask a volunteer for a hint or use SENSAI through the Help
      option on pwn.college.

    challenges:

      # ── Grep Master ──────────────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: grep-master
        name: "Grep Master"
      # ── Unlock the Vault ─────────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: unlock-the-vault
        name: "Unlock the Vault"
      # ── The Artist's Clue ────────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: the-artists-clue
        name: "The Artist's Clue"
      # ── Pale Red Horse Squad ─────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: pale-red-horse-squad
        name: "Pale Red Horse Squad"
  # ──────────────────────────────────────────────────────────────
  #  EASY
  # ──────────────────────────────────────────────────────────────

  - id: easy
    name: "🔵 Easy"
    description: |
      These challenges build on the skills introduced in Beginner and
      require you to investigate more carefully or combine multiple
      steps.

      The instructions give you enough information to get started, but
      you may need to work out the exact commands or approach yourself.

      If you need to move text between the pwn.college virtual computer
      and your normal browser:

      1. On the left-hand side of the pwn.college virtual computer,
         look for the grey arrow.

      2. Click the grey arrow to open the side panel.

      3. Click the Clipboard icon.

      4. Paste your text into the Clipboard panel.

      5. You can then copy the text from the Clipboard panel and paste
         it into Firefox inside the pwn.college Desktop, or the other
         way around.

      If you get stuck, ask a volunteer or use SENSAI for a hint.

    challenges:

      # ── Chatty Server ────────────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: chatty-server
        name: "Chatty Server"
      # ── Social Media Password ────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: osint
          challenge: socialmediapassword
        name: "Social Media Password"
      # ── Locked Treasure Chest ────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: locked-treasure-chest
        name: "Locked Treasure Chest"
      # ── Am I Admin? (moved from Medium) ──────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin
        name: "Am I Admin?"
  # ──────────────────────────────────────────────────────────────
  #  MEDIUM
  # ──────────────────────────────────────────────────────────────

  - id: medium
    name: "🟠 Medium"
    description: |
      These challenges require you to combine ideas, investigate more
      carefully or understand a security concept.

      Each challenge tells you what you are trying to do and how to get
      started, but not every step. You will need to think about how
      things work and try different approaches.

      If you get stuck, use SENSAI through the Help link on pwn.college.
      Tell it what you have tried so far for better hints.

    challenges:

      # ── Secret Message in Photo (moved from Easy) ────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: secret-message-in-photo
        name: "Secret Message in Photo"
      # ── Magic Number ─────────────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: magic-number
        name: "Magic Number"
      # ── Hidden Treasures in the Picture ──────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: hidden-treasures-in-the-picture
        name: "Hidden Treasures in the Picture"
      # ── Am I Admin 2? ────────────────────────────────────────
      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin-2
        name: "Am I Admin 2?"
      # ── Reverse Plaintext Password (moved from Hard) ─────────
      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: reverse-password-plaintext
        name: "Reverse Plaintext Password"
  # ──────────────────────────────────────────────────────────────
  #  HARD
  # ──────────────────────────────────────────────────────────────

  - id: hard
    name: "🔴 Hard"
    description: |
      These challenges are intended for participants who already have
      some programming or cybersecurity experience.

      Each challenge tells you what the goal is, but not how to reach
      it. The first two are reverse engineering. The last three are
      binary exploitation and get harder in order. The final one is
      the toughest challenge in the competition.

      Read the code. Experiment. Break things.

      If you get stuck, use SENSAI through the Help link on pwn.college.

    challenges:

      # ── Terrible Token ──────────────────────────────────────
      - import:
          dojo: cse466-f2025
          module: reverse-engineering
          challenge: terrible-token-hard
        name: "Terrible Token"
      # ── Tangled Ticket ───────────────────────────────────────
      - import:
          dojo: cse466-f2025
          module: reverse-engineering
          challenge: tangled-ticket-hard
        name: "Tangled Ticket"
      # ── Tricky Control Hijack ────────────────────────────────
      - import:
          dojo: intro-to-cybersecurity
          module: binary-exploitation
          challenge: control-hijack-2
        name: "Tricky Control Hijack"
      # ── PIEs ─────────────────────────────────────────────────
      - import:
          dojo: intro-to-cybersecurity
          module: binary-exploitation
          challenge: pie-overflow
        name: "PIEs"
      # ── Hijack to Shellcode ──────────────────────────────────
      - import:
          dojo: intro-to-cybersecurity
          module: binary-exploitation
          challenge: hijack-to-shellcode
        name: "Hijack to Shellcode"
