id: leeds-compsoc-ctf-2026
name: Leeds CompSoc CTF TEST
type: hidden
password: LUCS26-CTF-SETUP

description: |
  Leeds Computing Society Capture the Flag competition.

  Work in teams of up to four and solve as many challenges as you can
  before the competition ends.

  You can attempt the challenges in any order. You do not need to
  complete the easier challenges before trying a harder one.

  Each challenge gives you a flag when you solve it. Submit the final
  pwn.college{...} flag on the challenge page to score.

  Never done a CTF before?
  Start with the Beginner challenges. They are designed to introduce
  you to the tools and ideas you need as you go.

  Important things to know:

  - Each challenge runs inside pwn.college.
  - Use the Terminal for command-line challenges.
  - If a challenge uses localhost or 127.0.0.1, open Firefox inside
    the pwn.college Desktop.
  - Your normal browser is outside the virtual computer.
  - If you need to move text between the virtual computer and your
    normal browser, use the Clipboard panel in the side tab of the
    pwn.college Desktop.
  - If you get stuck, ask your team or a volunteer for help.
  - You can also use SENSAI, the AI helper built into pwn.college.
    Start your challenge first, then use the Help link at the top
    of the page to access SENSAI.

modules:

  - id: beginner
    name: "🟢 Beginner"
    description: |
      Never done a CTF before? Start here.

      These challenges introduce basic commands and simple ideas.
      You do not need previous cybersecurity or programming experience.

      The Terminal is where you type instructions for the computer. You will
      use it to find files, search for information and run the tools you need
      to solve challenges.

      You can complete the challenges in any order.

      If you get stuck, try working it out with your team first. You can also
      ask a volunteer for a hint or use SENSAI through the Help option on
      pwn.college.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: grep-master
        name: "Grep Master"
        description: |
          You are looking for a hidden flag inside a very large text file
          called haystack.txt.

          You do not need to read the whole file yourself. Linux has a
          command called grep which can search a file for text.

          To start:

          1. Press Start.

             This opens the challenge and a Terminal. The Terminal is where
             you type instructions for the computer.

          2. Go to the challenge folder:

             cd /challenge

             `cd` means change directory. It moves you into a different folder.

          3. Type:

             ls

             This lists the files in the folder.

          4. Find haystack.txt.

             Remember that haystack.txt is a file, not a folder, so you do not
             need to use cd on it.

          5. Use grep to search haystack.txt for the hidden flag.

             The basic format is:

             grep "something to search for" filename

             The temporary flag will begin with:

             FLAG{

          6. When you find the complete temporary flag, run:

             /challenge/verify

             When the verifier asks for the flag, enter the complete temporary
             flag, including FLAG{}.

             For example, if the flag you found was:

             FLAG{something_here}

             you would enter the whole flag, including FLAG{ and }.

          7. If it is correct, the verifier will give you your final
             pwn.college{...} flag.

          8. Submit that final flag on the challenge page.

          Stuck?

          You are looking for text inside a file. Think about which command
          can search a file for a particular word or piece of text.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.


      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: unlock-the-vault
        name: "Unlock the Vault"
        description: |
          You are a treasure hunter and have found a locked ZIP file.

          The challenge contains:

          vault.zip
          vault_clue.txt

          The password for vault.zip is hidden somewhere in vault_clue.txt.

          Your job is to find the password, open the ZIP file and find
          the flag inside.

          To start:

          1. Press Start.

             This opens the challenge and a Terminal.

          2. Go to the challenge folder:

             cd /challenge

             `cd` means change directory. It moves you into a different folder.

          3. Type:

             ls

             This lists the challenge files.

          4. Use grep to search vault_clue.txt for information about the
             password.

             If you have not used grep before, look at the Grep Master
             challenge in the Beginner module for an example of how it works.

          5. Once you have found the password, use unzip to open vault.zip.

             You will need to extract the files into your home folder:

             unzip vault.zip -d /home/hacker

          6. When asked for the password, enter the password you found.

             Nothing will appear while you type. This is normal. Type the
             password and press Enter.

          7. Go to your home folder:

             cd /home/hacker

          8. Type:

             ls

             Look for the file that was extracted from the vault.

          9. Use cat to read the contents of the file.

             For example:

             cat filename.txt

          10. Find the complete temporary FLAG{...}.

          11. Run:

              /challenge/verify

              When the verifier asks for the flag, enter the complete
              temporary flag, including FLAG{}.

              For example, if the flag you found was:

              FLAG{something_here}

              you would enter the whole flag, including FLAG{ and }.

          12. If it is correct, the verifier will give you your final
              pwn.college{...} flag.

          13. Submit that final flag on the challenge page.

          Stuck?

          You need two things before you can open the vault: the ZIP file
          and its password. Look at the other file in /challenge and think
          about what information it might contain.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.


      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: the-artists-clue
        name: "The Artist's Clue"
        description: |
          You are investigating a mysterious painting called art.jpg.

          The flag is not hidden in the visible picture. It is hidden in
          information stored alongside the image.

          This extra information is called metadata.

          Metadata is information stored with a file. An image can contain
          information about the image in addition to the picture itself.

          You can use a command called exiftool to look at an image's metadata.

          To start:

          1. Press Start.

             This opens the challenge and a Terminal.

          2. Go to the folder containing the image:

             cd /home/ubuntu/Artists-Clue

             `cd` means change directory. It moves you into a different folder.

          3. Type:

             ls

             You should see art.jpg.

          4. Use exiftool to inspect the image.

             The basic format is:

             exiftool filename

             Use it to inspect art.jpg.

          5. Look carefully through the information it displays.

             You are looking for a temporary flag beginning with:

             FLAG{

          6. When you find the complete temporary flag, run:

             /challenge/verify

             When the verifier asks for the flag, enter the complete temporary
             flag, including FLAG{}.

             For example, if the flag you found was:

             FLAG{something_here}

             you would enter the whole flag, including FLAG{ and }.

          7. If it is correct, the verifier will give you your final
             pwn.college{...} flag.

          8. Submit that final flag on the challenge page.

          Stuck?

          Think about what information an image can store besides the visible
          picture. The challenge mentions a tool that can show this
          information.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.


      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: pale-red-horse-squad
        name: "Pale Red Horse Squad"
        description: |
          There is a secret club with a hidden entry passphrase.

          The passphrase has been left somewhere on the club's webpage.
          Your job is to find it.

          This challenge introduces you to webpages, localhost and
          investigating how a webpage works.

          To start:

          1. Press Start.

             This opens the challenge and a Terminal. The Terminal is where
             you type instructions for the computer.

          2. Go to the challenge folder:

             cd /challenge

             `cd` means change directory. It moves you into a different folder.

          3. Start the challenge:

             ./verify

             This starts the local website.

             Leave the Terminal running while you use the website.

          ### Open the website

          4. At the bottom of the Terminal, find the Desktop button next to
             the Code button.

             Click Desktop.

             The pwn.college virtual Desktop will open in a new browser tab.

          5. Find and open Firefox inside the virtual Desktop.

             Firefox is a web browser, like Chrome or Edge.

          6. In Firefox, click the address bar at the top and enter:

             http://127.0.0.1:5000

             You can type the address manually or copy and paste it.

             Then press Enter.

          Important:

          Use Firefox inside the pwn.college Desktop.

          Do not enter the address into the browser you normally use on
          your own computer.

          127.0.0.1 means this computer. In this challenge, the website is
          running on the pwn.college virtual computer, which is why you need
          to use Firefox inside the Desktop.

          ### Find the passphrase

          Look around the webpage and try to find the hidden passphrase.

          If you cannot find it by looking at the visible page, try
          investigating how the webpage is built.

          Firefox has Developer Tools which can help you investigate
          information behind a webpage.

          You do not need previous web development experience to solve this
          challenge.

          Once you find the passphrase, enter it into the webpage.

          The website will give you a pwn.college{...} flag.

          ### Submit your flag

          Copy the complete pwn.college{...} flag and submit it on the
          competition challenge page.

          If you need to move text between the virtual Desktop and your
          normal computer, use the Clipboard panel in the side tab of the
          pwn.college Desktop.

          Stuck?

          The passphrase is somewhere on the webpage, but it may not be
          visible on the page itself. Think about where a webpage stores
          information that visitors normally do not see.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.

  - id: easy
    name: "🔵 Easy"
    description: |
      These challenges are still approachable for beginners, but require
      you to work out a little more for yourself.

      You may need to combine commands, investigate information more carefully,
      or use a tool's help options to work out the exact syntax.

      If you get stuck, try to identify what you know and what you still need
      to work out before asking for help. You can ask a volunteer for a hint
      or use SENSAI through the Help option on pwn.college.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: chatty-server
        name: "Chatty Server"
        description: |
          You are investigating a server log called server.log.

          The log contains lots of activity from different users. Somewhere
          in the log, a user has left behind three pieces of a temporary flag.

          There are also fake flags, so you will need to work out which
          information is relevant.

          Start by going to:

             cd /home/ubuntu/Chatty-Server

          Use commands such as `grep` to search the log and narrow down
          the information you need.

          If you have not used grep before, look at the Grep Master challenge
          in the Beginner module for an example of the basic syntax.

          Find the three pieces of the flag and work out how they fit together
          to form the complete FLAG{...}.

          When you have the complete temporary flag, run:

             /challenge/verify

          Enter the complete temporary flag, including FLAG{}, to receive
          your final pwn.college{...} flag.

          Stuck?

          Not every line containing FLAG is part of the real flag. Think about
          what the three real pieces have in common.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.


      - import:
          dojo: cyber-security~59368da7
          module: osint
          challenge: socialmediapassword
        name: "Social Media Password"
        description: |
          You have been given a fictional social media profile belonging to
          @random_dude12.

          The profile contains three posts with information about the person.

          Your job is to use information from all three posts to work out
          a possible password.

          To start:

          1. Press Start.

             This opens the challenge and a Terminal.

          2. Run:

             /challenge/run

             Leave this Terminal running while you use the website.

          3. At the bottom of the Terminal, find the Desktop button next to
             the Code button.

             Click Desktop to open the pwn.college virtual Desktop in a
             new browser tab.

          4. Open Firefox inside the virtual Desktop.

             Firefox is a web browser, like Chrome or Edge.

          5. In Firefox, enter:

             http://127.0.0.1:5000

             You can type this into the address bar or copy and paste it.

          6. Read the three posts carefully and look for information that
             could be used to construct a password.

          7. When you have a possible password, return to the Terminal
             running the challenge and run:

             /challenge/verify

          8. Enter your password.

          9. If it is accepted, the verifier will give you your final
             pwn.college{...} flag.

          10. Submit that flag on the challenge page.

          Important:

          You need two things running at the same time: the local website
          and a Terminal where you can run commands.

          If the Terminal is currently displaying the web server output,
          open another Terminal from the pwn.college Desktop to run
          `/challenge/verify`.

          127.0.0.1 refers to the challenge computer. This is why the website
          must be opened in Firefox inside the pwn.college Desktop rather
          than your normal browser.

          Everything in this challenge is fictional and runs locally.

          Stuck?

          The password should contain information taken from the different
          posts. Think about what details someone might choose when creating
          an easy-to-remember password.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.


      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: locked-treasure-chest
        name: "Locked Treasure Chest"
        description: |
          You have found a digital treasure chest containing another ZIP file.

          The flag is hidden in information about the ZIP file rather than
          inside a normal file.

          Start by going to:

             cd /challenge

          Extract digital_treasure.zip into your home folder.

          You will find another ZIP file inside. Do not extract this second
          ZIP file.

          Instead, investigate the information stored about the ZIP file.
          The command `zipinfo` can help you inspect ZIP files.

          If you are unsure how to use zipinfo, try:

             zipinfo -h

          Look through the information you find for the temporary FLAG{...}.

          When you find the complete temporary flag, run:

             /challenge/verify

          Enter the complete temporary flag, including FLAG{}, to receive
          your final pwn.college{...} flag.

          Stuck?

          Think about where the second ZIP file was extracted and what
          information a ZIP file can contain besides the files themselves.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.


      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: secret-message-in-photo
        name: "Secret Message in Photo"
        description: |
          A photograph called suspicious_doggo.jpg contains hidden
          information.

          This is an example of steganography, where information is hidden
          inside another file.

          The photograph is protected by a passphrase. Somewhere in
          secret.txt you can find the passphrase needed to extract the
          hidden information.

          Start by going to:

             cd /home/ubuntu/Secret-Message-in-Photo

          Find the passphrase in secret.txt.

          You will then need to use `steghide` to extract the hidden
          information from the photograph.

          If you are unsure how steghide works, try:

             steghide --help

          Look through the available options for the ones that allow you to:

          - extract hidden information
          - provide the passphrase
          - specify the image containing the hidden information
          - choose where the extracted information is saved

          Save the extracted information as a file in your home folder so
          you can read it afterwards.

          Read the extracted file to find the temporary FLAG{...}.

          When you find the complete temporary flag, run:

             /challenge/verify

          Enter the complete temporary flag, including FLAG{}, to receive
          your final pwn.college{...} flag.

          Stuck?

          Before you can extract anything, you need to know the passphrase
          and the image containing the hidden information. Think about what
          the different steghide options are asking you to provide.

          If you are still stuck, ask a volunteer for a hint or use SENSAI.

  - id: medium
    name: "🟠 Medium"
    description: |
      These challenges require you to combine ideas, investigate more
      carefully or understand a security concept.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin
        name: "Am I Admin?"
        description: |
          This website uses a browser cookie to decide whether you are an
          administrator.

          Your job is to understand how the website is making that decision
          and see whether you can change the information stored in your browser.

          Start the web application with:

          /challenge/app.py

          Then open Firefox inside the pwn.college Desktop and visit:

          http://127.0.0.1:5000

          Investigate the cookies used by the website and see what happens
          when their values change.

          If you can make the website treat you as an administrator, the
          admin page will show you the flag.

          Submit the pwn.college{...} flag shown by the website.


      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: magic-number
        name: "Magic Number"
        description: |
          A program is hiding a secret number.

          Each time the program runs, it chooses one number from a small set
          of possible values.

          Your job is to inspect the program and work out what those possible
          numbers are.

          One useful command is:

          strings

          Start by investigating:

          /challenge/magic_numbers

          Then run the program and try the values you have found.

          When you guess correctly, the program will give you a special
          output string.

          Give that string to:

          /challenge/verify

          to receive your pwn.college{...} flag.


      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: hidden-treasures-in-the-picture
        name: "Hidden Treasures in the Picture"
        description: |
          A mysterious image contains four separate pieces of a flag.

          The pieces have been hidden using several different techniques.

          Your job is to investigate the image and find all four pieces.

          You may find tools such as these useful:

          strings
          grep
          exiftool
          steghide
          binwalk

          Keep track of each part as you find it.

          Once you have all four pieces, put them together to make the
          complete temporary FLAG{...}.

          Run:

          /challenge/verify

          Enter the complete temporary flag to receive your final
          pwn.college{...} flag.


      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin-2
        name: "Am I Admin 2?"
        description: |
          This is a harder version of Am I Admin?

          The website still uses a browser cookie to decide whether you are
          an administrator, but the previous approach no longer works.

          This time you also have access to the Python code behind the website.

          Start the application with:

          /challenge/app.py

          Open Firefox inside the pwn.college Desktop and visit:

          http://127.0.0.1:5000

          Investigate the cookie and then look at the Python code in /challenge.

          Work out how the website checks the cookie and what value it expects.

          If you can make the website treat you as an administrator, it will
          show you the pwn.college{...} flag.


  - id: hard
    name: "🔴 Hard"
    description: |
      These challenges are intended for participants who already have some
      programming or cybersecurity experience.

      They provide less guidance and require you to work out more of the
      solution yourself.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: reverse-password-plaintext
        name: "Reverse Plaintext Password"
        description: |
          A Python program generates a password from several lists of
          characters.

          You have access to the source code.

          Your job is to follow the program's logic and work out exactly
          which characters are selected and in what order.

          Open the VS Code Workspace and inspect:

          /challenge/plaintextPassword.py

          Follow the functions used to construct the password.

          Once you have worked out the password, run:

          /challenge/verify

          Enter it to receive your pwn.college{...} flag.
