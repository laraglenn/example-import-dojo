id: leeds-compsoc-ctf-2026
name: Leeds CompSoc CTF 2026
type: hidden
password: LUCS26-CTF-SETUP

description: |
  Leeds Computing Society Capture the Flag competition.
  Work in teams of up to 4 to solve cybersecurity challenges.
  Each challenge is worth one point.

modules:

  - id: forensics
    name: Forensics
    description: |
      Find information hidden in files and images.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: grep-master

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: unlock-the-vault

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: locked-treasure-chest

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: the-artists-clue

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: secret-message-in-photo

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: hidden-treasures-in-the-picture


  - id: web
    name: Web
    description: |
      Find and exploit simple web vulnerabilities.

      For the web challenges, use Firefox inside the pwn.college Desktop.
      When instructed to visit 127.0.0.1:5000, enter it in Firefox inside the Desktop.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: pale-red-horse-squad

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin-2


  - id: programs
    name: PWN / Reverse Engineering
    description: |
      Investigate programs and work out how they behave.

      For the Reverse Password Plaintext challenge, select VSCode Workspace
      from the challenge menu and use it inside the pwn.college Desktop.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: buffer-overflow

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: magic-number

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: reverse-password-plaintext


  - id: osint
    name: OSINT
    description: |
      Find information using publicly available information.

      For the Social Media Password challenge, use Firefox inside the
      pwn.college Desktop to open 127.0.0.1:5000.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: osint
          challenge: socialmediapassword
