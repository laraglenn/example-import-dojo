id: leeds-compsoc-ctf-2026
name: Leeds CompSoc CTF TEST
type: hidden
password: LUCS26-CTF-SETUP

description: |
  Leeds Computing Society Capture the Flag competition.
  Work in teams of up to 4 to solve cybersecurity challenges.
  Each challenge is worth one point.

modules:

  - id: forensics
    name: Forensics
    description: |
      Find information hidden in files and images.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: grep-master
        name: "Grep Master [Easy]"

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: unlock-the-vault
        name: "Unlock the Vault [Easy]"

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: the-artists-clue
        name: "The Artist's Clue [Easy]"

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: locked-treasure-chest
        name: "Locked Treasure Chest [Easy-Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: secret-message-in-photo
        name: "Secret Message in Photo [Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: forensics
          challenge: hidden-treasures-in-the-picture
        name: "Hidden Treasures in the Picture [Hard]"


  - id: web
    name: Web
    description: |
      Find and exploit simple web vulnerabilities.

      For the web challenges, use Firefox inside the pwn.college Desktop.
      When instructed to visit 127.0.0.1:5000, enter it in Firefox inside the Desktop.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: pale-red-horse-squad
        name: "Pale Red Horse Squad [Easy]"

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin
        name: "Am I Admin? [Easy-Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: am-i-admin-2
        name: "Am I Admin 2? [Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: web
          challenge: creepy-crawly
        name: "Creepy Crawly [Hard]"


  - id: programs
    name: PWN / Reverse Engineering
    description: |
      Investigate programs and work out how they behave.

      For the Reverse Password Plaintext and Reverse Cipher Password
      challenges, select VSCode Workspace from the challenge menu and
      use it inside the pwn.college Desktop.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: buffer-overflow
        name: "Buffer Overflow [Easy-Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: magic-number
        name: "Magic Number [Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: reverse-password-plaintext
        name: "Reverse Password Plaintext [Medium]"

      - import:
          dojo: cyber-security~59368da7
          module: pwn
          challenge: reverse-password-cipher
        name: "Reverse Cipher Password [Hard]"


  - id: osint
    name: OSINT
    description: |
      Find information using publicly available information.

      For the Social Media Password challenge, use Firefox inside the
      pwn.college Desktop to open 127.0.0.1:5000.

    challenges:

      - import:
          dojo: cyber-security~59368da7
          module: osint
          challenge: socialmediapassword
        name: "Social Media Password [Easy]"
